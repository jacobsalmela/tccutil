# Runs tccutil.py against the TCC.db schema fixtures in tests/fixtures.
#
# The tests simulate each fixture's macOS version, so they run on Linux.
# Python 3.9 is what /usr/bin/python3 (Command Line Tools) provides on macOS.

name: Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.9', '3.x' ]

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: python -m pip install packaging
    - name: Run tests
      run: python -m unittest discover -s tests -v
